version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: ecommerce_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-R00t!S3cur3P@ss2024}
      MYSQL_DATABASE: ${DB_DATABASE:-ecommerce_db}
      MYSQL_USER: ${DB_USERNAME:-ecommerce_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-Ec0mm3rc3!S3cur3P@ss}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ecommerce_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-R00t!S3cur3P@ss2024}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    ports:
      - "3306"

  # Application (Nginx + PHP-FPM + Worker in one container)
  app:
    build:
      context: .
      dockerfile: Dockerfile.coolify
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:-latest}
    container_name: ecommerce_app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Application
      APP_NAME: "E-Commerce Platform"
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-https://site.polyes.tr}
      APP_TIMEZONE: Europe/Istanbul

      # Database (connects to mysql service)
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-ecommerce_db}
      DB_USERNAME: ${DB_USERNAME:-ecommerce_user}
      DB_PASSWORD: ${DB_PASSWORD:-Ec0mm3rc3!S3cur3P@ss}

      # Default Settings
      DEFAULT_LANG: tr
      DEFAULT_CURRENCY: TRY

      # Admin User (will be created automatically)
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@polyes.tr}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!S3cur3}
      ADMIN_NAME: ${ADMIN_NAME:-Admin User}

      # Features
      FEATURE_B2B: "true"
      FEATURE_WAREHOUSE: "true"
      FEATURE_PROJECTS: "true"

      # Pricing
      PRICE_VISIBILITY: visible
      PRICE_INCLUDES_VAT: "true"
      DEFAULT_VAT_RATE: 20

      # Auto Setup (these trigger automatic setup on first run)
      AUTO_MIGRATE: "true"
      AUTO_SEED: "true"
      AUTO_START_WORKER: "true"
    volumes:
      - storage_data:/var/www/html/storage
      - uploads_data:/var/www/html/public/uploads
    networks:
      - ecommerce_network
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s

# Networks
networks:
  ecommerce_network:
    driver: bridge

# Volumes
volumes:
  mysql_data:
    driver: local
  storage_data:
    driver: local
  uploads_data:
    driver: local
